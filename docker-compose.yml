services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: procurement_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: postt11
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d procurement_db"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://root:postt11@postgres:5432/procurement_db
      JWT_SECRET: asdfgh
      PORT: 8080
      FINANCE_MODULE_URL: ${FINANCE_MODULE_URL}
      ASSET_MODULE_URL: ${ASSET_MODULE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
     - "3000:80"
    depends_on:
     - backend

volumes:
  pg_data: